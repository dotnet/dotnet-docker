name: Update Dependencies Tests

on:
  pull_request:
    paths:
      - '.editorconfig'
      - 'Directory.Build.props'
      - 'Microsoft.DotNet.Docker.slnx'
      - 'eng/update-dependencies/**'
      - 'eng/shared/**'
      - 'tests/**'
      - '!tests/Microsoft.DotNet.Docker.Tests/TestAppArtifacts/**'
      - '.github/workflows/update-dependencies-tests.yml'

permissions: {}

jobs:
  test:
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore dependencies
        run: >
          dotnet restore
          Microsoft.DotNet.Docker.slnx
          --verbosity normal

      - name: Verify formatting
        run: dotnet format Microsoft.DotNet.Docker.slnx --no-restore --verify-no-changes

      - name: Build solution
        run: >
          dotnet build
          Microsoft.DotNet.Docker.slnx
          --no-restore

      - name: Run tests
        run: >
          dotnet test
          tests/UpdateDependencies.Tests/UpdateDependencies.Tests.csproj
          --no-build --verbosity normal --logger trx
          --results-directory TestResults

      - name: Upload test results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results
          path: TestResults/*.trx
