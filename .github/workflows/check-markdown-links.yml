name: 'Check Markdown Links'

on:
  pull_request:
    paths:
      - "**/*.md"
      - ".github/workflows/check-markdown-links.yml"

permissions:
  contents: read

jobs:
  check-markdown-links:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # mlc treats GitHub alert markers as unresolved Markdown references, so remove them from the temporary checkout.
      - name: Remove GitHub alert markers
        run: find . -name '*.md' -exec sed -i -E 's/> \[!(NOTE|TIP|IMPORTANT|WARNING|CAUTION)\]//g' {} +

      - name: Check markdown links
        uses: becheran/mlc@7ec24825cefe0c9c8c6bac48430e1f69e3ec356e # v1.2.0
        with:
          # Suppress expected redirects for locale-neutral Microsoft URLs and unauthenticated GitHub links.
          args: >-
            .
            --markup-types md
            --gitignore
            --root-dir .
            --ignore-path eng/announcement-templates,eng/readme-templates
            --ignore-links https://github.com/microsoft/mcr*,https://github.com/dotnet/release*,https://aka.ms/*,https://go.microsoft.com/fwlink/*
            --do-not-warn-for-redirect-to https://github.com/login*,https://learn.microsoft.com/??-??/*,https://dotnet.microsoft.com/??-??/*,https://www.microsoft.com/??-??/*,https://en.wikipedia.org/*
            --throttle 250
